```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6);
    overflow:hidden;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(255,105,180,.2);
}

h1{
    color:#ff4f8b;
    margin-bottom:20px;
}

.buttons{
    position:relative;
    height:120px;
    margin-top:20px;
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
}

#yesBtn{
    background:#ff4f8b;
    color:white;
}

#noBtn{
    background:#ddd;
    position:absolute;
    left:60%;
    top:0;
}

.gift-section{
    display:none;
}

.gift{
    font-size:120px;
    cursor:pointer;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-15px);
    }
}

.message{
    display:none;
    margin-top:20px;
    color:#ff4f8b;
    line-height:1.7;
}

.gallery{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.gallery img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:20px;
    border:3px solid white;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.heart{
    position:fixed;
    pointer-events:none;
    animation:floatUp 1.2s forwards;
    font-size:24px;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-120px);
    }
}

@media(max-width:428px){

    .gallery img{
        width:90px;
        height:90px;
    }

    button{
        font-size:16px;
        padding:12px 24px;
    }

    .gift{
        font-size:100px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="card" id="questionCard">

        <h1>Do you love this guy? ❤️</h1>

        <img src="your-photo.jpg"
             width="180"
             style="border-radius:20px;margin-bottom:20px;">

        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😏
            </button>

        </div>

    </div>

    <div class="card gift-section" id="giftSection">

        <h1>YAYYYYY 🥰❤️</h1>

        <p>Click the present!</p>

        <div class="gift" onclick="openGift()">
            🎁
        </div>

        <div class="message" id="message">

            <h2>I Love You ❤️</h2>

            <p>
                Thank you for being the best thing
                that ever happened to me.
                Every day with you is my favorite day.
            </p>

            <div class="gallery">

                <img src="photo1.jpg">
                <img src="photo2.jpg">
                <img src="photo3.jpg">

            </div>

        </div>

    </div>

</div>

<script>

const noBtn = document.getElementById("noBtn");

function moveButton(){

    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 80;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

document.getElementById("yesBtn")
.addEventListener("click", () => {

    document.getElementById("questionCard")
    .style.display = "none";

    document.getElementById("giftSection")
    .style.display = "block";

});

function openGift(){

    document.querySelector(".gift").innerHTML = "💝";

    document.getElementById("message")
    .style.display = "block";

    for(let i=0;i<30;i++){

        const heart = document.createElement("div");

        heart.className="heart";
        heart.innerHTML="❤️";

        heart.style.left =
        Math.random()*window.innerWidth + "px";

        heart.style.top =
        Math.random()*window.innerHeight + "px";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },1200);
    }
}

</script>

</body>
</html>
